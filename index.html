<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Animal — Cadastro</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header class="topo">
        <div class="container">
            <h1>Mundo Animal</h1>
            <p>Cadastro e controle de pets</p>
        </div>
    </header>

    <main class="container">
        <section class="bloco" aria-labelledby="titulo-formulario">
            <h2 id="titulo-formulario">Novo animal</h2>
            <form id="formAnimal">
                <div class="campos">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Ex.: Mel" required>
                    </div>

                    <div class="campo">
                        <label for="especie">Espécie</label>
                        <select id="especie" required>
                            <option value="">Selecione</option>
                            <option value="Cachorro">Cachorro</option>
                            <option value="Gato">Gato</option>
                            <option value="Coelho">Coelho</option>
                            <option value="Pássaro">Pássaro</option>
                            <option value="Tartaruga">Tartaruga</option>
                            <option value="Hamster">Hamster</option>
                            <option value="Peixe">Peixe</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="idade">Idade (anos)</label>
                        <input type="number" id="idade" min="0" max="100" placeholder="0" required>
                    </div>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <section class="bloco" aria-labelledby="titulo-lista">
            <div class="cabecalho-lista">
                <h2 id="titulo-lista">Animais cadastrados</h2>
                <span class="contador" id="contador">0</span>
            </div>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Espécie</th>
                            <th>Idade</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
